 body {

}

.form-contacto {

.form-contacto input,

  background-color: #00ff99;
  color: #000;
  font-weight: bold;
  padding: 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.form-contacto button:hover {
  background-color: #00cc77;
  transform: scale(1.03);
}
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-variation-settings:
        'FILL' 0,
        'wght' 400,

<body>

    <a href="index.html" style="color: #00ff99; text-decoration: none;">Barriga Fit</a>
  </div>
        <nav>
          <ul>

              <a href="index.html" style="color: #00ff99; text-decoration: none;">

  <section id="contacto">
  <h2 class="contacto-titulo">Contáctanos</h2>
  <p class="contacto-texto">¿Tienes dudas, sugerencias o quieres empezar tu transformación? Escríbenos y te responderemos pronto.</p>

  <form class="form-contacto" id="contactoForm">
    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
    <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
    <button type="submit">Enviar mensaje</button>
  </form>
</section>
<script>
  const contactoForm = document.getElementById('contactoForm');

  contactoForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value;
    const correo = document.getElementById('correo').value;
    const mensaje = document.getElementById('mensaje').value;

    try {
      // Build API URL: if the page was opened via file://, point to localhost explicitly
      const apiUrl = location.protocol === 'file:'
        ? 'http://localhost:3000/api/contacto'
        : `${location.protocol}//${location.host}/api/contacto`;
      console.log('Sending contacto to', apiUrl);
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ nombre, correo, mensaje })
      });

      // Try to parse JSON safely; fall back to text if server returned HTML (404 page)
      let data;
      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        data = await response.json();
      } else {
        const text = await response.text();
        try { data = JSON.parse(text); } catch (e) { data = { error: text }; }
      }

      if (response.ok) {
        Swal.fire({
          icon: 'success',
          title: 'Mensaje enviado',
          text: 'Gracias por contactarnos, te responderemos pronto',
          background: '#0a3d3d',
          color: '#00ff99',
          confirmButtonColor: '#00ff99',
          confirmButtonText: 'OK',
          iconColor: '#00ff99'
        });
        contactoForm.reset();
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: data && data.error ? data.error : 'Error en el servidor',
          background: '#0a3d3d',
          color: '#00ff99',
          confirmButtonColor: '#ff4141',
          confirmButtonText: 'OK',
          iconColor: '#ff4141'
        });
      }
    } catch (error) {
      console.error('Error:', error);
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Error en la conexión con el servidor',
        background: '#0a3d3d',
        color: '#00ff99',
        confirmButtonColor: '#ff4141',
        confirmButtonText: 'OK',
        iconColor: '#ff4141'
      });
    }
  });

  function goBack() {
    window.history.back();
  }
  function goForward() {
    window.history.forward();
  }
  // Autocompletar nombre y correo si hay sesión activa
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const resp = await fetch('/api/verificar');
      const info = await resp.json();
      if (info.autenticado) {
        if (info.usuario) document.getElementById('nombre').value = info.usuario;
        if (info.correo) document.getElementById('correo').value = info.correo;
      }
    } catch (err) {
      console.error('No se pudo verificar sesión:', err);
    }
  });
</script>
<script src="sesion.js"></script>
</body>
