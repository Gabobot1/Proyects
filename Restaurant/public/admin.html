<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrador</title>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="CSS/AdminStyle.css">
</head>

<body class="p-4">
  <div class="admin-topbar d-flex justify-content-between align-items-center px-4 mb-4">
    <h1 class="admin-title m-0">Panel Administrador</h1>
    <div class="btn-group-admin">
      <button class="btn-admin btn-user" onclick="irUsuario()">Vista Usuario</button>
      <button class="btn-admin btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>
  <div id="alertas"></div>
  <form id="formProducto" class="card p-4 shadow">
    <label>Nombre:</label>
    <input type="text" id="nombre" class="form-control mb-2" required>

    <label>Precio:</label>
    <input type="number" id="precio" step="0.01" class="form-control mb-2" required>

    <label>Descripción:</label>
    <textarea id="descripcion" class="form-control mb-2"></textarea>

    <label>Imagen (Archivo): </label>
    <input type="file" id="imagenArchivo" class="form-control mb-2">

    <label>Imagen (URL):</label>
    <input type="text" id="imagenURL" class="form-control mb-2" placeholder="https://...">


    <label>Categoría:</label>
    <select id="categoria" class="form-control mb-2" required>
      <option value="comidas">Comidas</option>
      <option value="carnes">Carnes</option>
      <option value="bebidas">Bebidas</option>
      <option value="bodega">Cerveza de bodega</option>
    </select>

    <label>Disponible:</label>
    <select id="disponible" class="form-control mb-3">
      <option value="1">Sí</option>
      <option value="0">No</option>
    </select>

    <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
  </form>

  <hr class="my-4">

  <h3>Productos registrados</h3>

  <table class="table table-dark table-striped mt-3" id="tablaProductos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   <h3>Reservas</h3>

  <table class="table table-dark table-striped mt-3" id="tablaReservas">
    <thead>
      <tr>
        <th>ID_reserva</th>
        <th>Nombre</th>
        <th>Telefono</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Personas</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function cerrarSesion() {
      Swal.fire({
        title: "¿Cerrar sesión?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, salir",
        cancelButtonText: "Cancelar"
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.clear();
          window.location.href = "LOGIN.html";
        }
      });
    }

    function irUsuario() {
      Swal.fire({
        icon: "info",
        title: "Redirigiendo…",
        timer: 800,
        showConfirmButton: false
      });

      window.location.href = "Menu.html";
    }
    function mostrarAlerta(mensaje, tipo = "success") {
      const alertBox = `
        <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
          ${mensaje}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      document.getElementById("alertas").innerHTML = alertBox;
    }

    async function cargarTablaProductos() {
      const res = await fetch("/productos");
      const productos = await res.json();

      const tbody = document.querySelector("#tablaProductos tbody");

      tbody.innerHTML = productos.map(p => `
  <tr>
    <td>${p.ID_producto_pedido}</td>
    <td>
      <img src="${p.Imagen && p.Imagen.trim() !== "" ? p.Imagen : '/imagenes/default.png'}"
           width="60"
           onerror="this.onerror=null; this.src='/imagenes/default.png';">
    </td>
    <td>${p.Nombre}</td>
    <td>S/ ${p.Precio}</td>
    <td>
      <button class="noselect" onclick="eliminarProducto(${p.ID_producto_pedido})"><span class="text">Eliminar</span><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212 8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666 3.666 8.237-8.318 8.285 8.203z"></path></svg></span></button>
    </td>
  </tr>
`).join("");



    }
    async function eliminarProducto(id) {
      Swal.fire({
        title: "¿Eliminar producto?",
        text: "Esta acción no se puede deshacer",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar",
        background: "#1a1a2e",
        color: "white",
        customClass: {
          popup: "shadow-lg rounded-4 border border-secondary"
        }
      }).then(async (result) => {
        if (!result.isConfirmed) return;

        const res = await fetch(`/eliminar-producto/${id}`, { method: "DELETE" });
        const data = await res.json();

        Swal.fire({
          icon: "success",
          title: "Producto eliminado",
          text: data.mensaje,
          timer: 1500,
          showConfirmButton: false,
          background: "#1a1a2e",
          color: "white"
        });

        cargarTablaProductos();
      });
    }
    document.getElementById("formProducto").addEventListener("submit", async (e) => {
      e.preventDefault();

      const imagenArchivo = document.getElementById("imagenArchivo");
      const imagenURL = document.getElementById("imagenURL");

      const formData = new FormData();
      formData.append("Nombre", nombre.value);
      formData.append("Precio", precio.value);
      formData.append("Descripcion", descripcion.value);
      formData.append("Categoria", categoria.value);
      formData.append("Disponible", disponible.value);

      if (imagenArchivo.files.length > 0) {
        formData.append("imagen", imagenArchivo.files[0]);
      } else {
        formData.append("Imagen", imagenURL.value);
      }

      const res = await fetch("/agregar-producto", {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      mostrarAlerta(data.mensaje, "success");
      cargarTablaProductos();
    });
    cargarTablaProductos();

  </script>
  <script>
async function cargarReservas() {
  const res = await fetch("/reservas");
  const reservas = await res.json();

  const tbody = document.querySelector("#tablaReservas tbody");

  tbody.innerHTML = reservas.map(r => `
    <tr>
      <td>${r.ID_reserva}</td>
      <td>${r.Nombre}</td>
      <td>${r.Telefono}</td>
      <td>${r.Fecha.split("T")[0]}</td>
      <td>${formatearHora(r.Hora)}</td>
      <td>${r.Personas}</td>
      <td>
        <select class="form-select form-select-sm"
          onchange="cambiarEstado(${r.ID_reserva}, this.value)">
          <option ${r.Estado === "Pendiente" ? "selected" : ""}>Pendiente</option>
          <option ${r.Estado === "Confirmada" ? "selected" : ""}>Confirmada</option>
          <option ${r.Estado === "Cancelada" ? "selected" : ""}>Cancelada</option>
        </select>
      </td>
    </tr>
  `).join("");
}
function formatearHora(horaISO) {
  if (!horaISO) return "";

  const date = new Date(horaISO);

  const horas = String(date.getUTCHours()).padStart(2, "0");
  const minutos = String(date.getUTCMinutes()).padStart(2, "0");

  return `${horas}:${minutos}`;
}
</script>
<script>
async function cambiarEstado(id, estado) {
  if (estado === "Cancelada") {
    const confirm = await Swal.fire({
      title: "¿Cancelar reserva?",
      text: "Esta acción eliminará la reserva",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Sí, cancelar",
      cancelButtonText: "No"
    });

    if (!confirm.isConfirmed) {
      cargarReservas(); 
      return;
    }


    Swal.fire({
      icon: "success",
      title: "Reserva cancelada",
      timer: 1200,
      showConfirmButton: false
    });
    return;
  }
  await fetch(`/reserva/${id}/estado`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ estado })
  });

  Swal.fire({
    icon: "success",
    title: "Estado actualizado",
    timer: 1000,
    showConfirmButton: false
  });
}

    cargarReservas();
</script>

</body>

</html>
